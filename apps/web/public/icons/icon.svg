<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Scoreboard outline -->
  <rect x="56" y="140" width="400" height="232" rx="16" fill="none" stroke="#ff2a6d" stroke-width="6" filter="url(#glow)"/>
  <!-- Score display area -->
  <rect x="80" y="180" width="150" height="80" rx="8" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <rect x="282" y="180" width="150" height="80" rx="8" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <!-- VS text -->
  <text x="256" y="235" font-family="Arial Black, sans-serif" font-size="32" fill="#ff2a6d" text-anchor="middle" filter="url(#glow)">VS</text>
  <!-- Score numbers -->
  <text x="155" y="245" font-family="Arial Black, sans-serif" font-size="56" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">21</text>
  <text x="357" y="245" font-family="Arial Black, sans-serif" font-size="56" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">14</text>
  <!-- LIVE indicator -->
  <circle cx="106" y="320" r="8" fill="#ff2a6d">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="126" y="325" font-family="Arial Black, sans-serif" font-size="20" fill="#ff2a6d" filter="url(#glow)">LIVE</text>
  <!-- HI text -->
  <text x="256" y="100" font-family="Arial Black, sans-serif" font-size="48" fill="#ff2a6d" text-anchor="middle" filter="url(#glow)">HI</text>
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="24" fill="#888" text-anchor="middle">SPORTS</text>
</svg>